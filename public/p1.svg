<svg width="464" height="300" viewBox="0 0 464 300" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 72px; font-weight: 800; fill: #1a202c; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 400; fill: #4a5568; }
      .small-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #a0aec0; }
      .feature-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #1a202c; }
      .feature-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; fill: #718096; }
      .button-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600; fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect x="14.8994" y="0.136963" width="449.906" height="319.73" rx="10" transform="rotate(2.63 14.8994 0.136963)" fill="#f7fafc"/>
  
  <!-- Main content group with right tilt -->
  <g transform="translate(232, 150) rotate(2.63) scale(0.396) translate(-700, -400)">
  
  <!-- Main Title -->
  <text x="700" y="220" text-anchor="middle" class="title">AI Agent Assistant</text>
  
  <!-- Subtitle line 1 -->
  <text x="700" y="280" text-anchor="middle" class="subtitle">Meet your new AI chat companion that goes beyond</text>
  
  <!-- Subtitle line 2 -->
  <text x="700" y="315" text-anchor="middle" class="subtitle">conversation - it can actually get things done!</text>
  
  <!-- Powered by text -->
  <text x="700" y="355" text-anchor="middle" class="small-text">Powered by IBM's WxTools &amp; your favourite LLM's.</text>
  
  <!-- Sign Up Button -->
  <g transform="translate(700, 410)" cursor="pointer">
    <rect x="-75" y="-25" width="150" height="50" rx="25" fill="#1a202c"/>
    <text x="0" y="5" text-anchor="middle" class="button-text">Sign Up</text>
    <!-- Arrow -->
    <path d="M 45 0 L 52 0 M 48 -4 L 52 0 L 48 4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Features Section -->
  
  <!-- Fast Feature -->
  <g transform="translate(330, 560)">
    <text x="0" y="0" text-anchor="middle" class="feature-title">Fast</text>
    <text x="0" y="35" text-anchor="middle" class="feature-desc">Real-time streamed responses</text>
  </g>
  
  <!-- Modern Feature -->
  <g transform="translate(700, 560)">
    <text x="0" y="0" text-anchor="middle" class="feature-title">Modern</text>
    <text x="0" y="35" text-anchor="middle" class="feature-desc">Next.js 15, Tailwind CSS, Convex,</text>
    <text x="0" y="60" text-anchor="middle" class="feature-desc">Clerk</text>
  </g>
  
  <!-- Smart Feature -->
  <g transform="translate(1070, 560)">
    <text x="0" y="0" text-anchor="middle" class="feature-title">Smart</text>
    <text x="0" y="35" text-anchor="middle" class="feature-desc">Powered by Your Favourite LLM's</text>
  </g>
  
  </g>
</svg>